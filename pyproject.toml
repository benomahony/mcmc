[project]
name = "mcmc"
version = "0.1.0"
description = "Monte Carlo delivery forecasts from Jira throughput (Claude Code plugin)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["duckdb>=1.1", "httpx", "hypothesis>=6.100", "jira820>=0.12", "pyright>=1.1.400", "pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["skills/forecast/scripts", "tests"]
extraPaths = ["skills/forecast/scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
